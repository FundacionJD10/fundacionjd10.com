name: Build check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build
              env:
                  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
                  PUBLIC_R2_PUBLIC_URL: ${{ vars.PUBLIC_R2_PUBLIC_URL }}

